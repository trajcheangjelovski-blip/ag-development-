services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agdev_app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DEMOS_DIR=/app/demos-data
    volumes:
      - ./.demos-live:/app/demos-data

  caddy:
    image: caddy:2-alpine
    container_name: agdev_caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.demos-live:/srv/site/demos:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
